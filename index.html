<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>安竸的工作台</title>
<script>
// 自动检测设备并跳转
(function(){
  var isMobile = /Android|iPhone|iPad|iPod|Windows Phone|BlackBerry|Mobile/i.test(navigator.userAgent) || window.innerWidth < 768;
  if(isMobile){
    window.location.replace("mobile.html");
  } else {
    window.location.replace("desktop.html");
  }
})();
</script>
</head>
<body style="background:#fff;font-family:sans-serif;text-align:center;padding:40px 20px;color:#888">
<p>正在跳转…</p>
<p style="margin-top:12px;font-size:13px">
  <a href="desktop.html" style="color:#2a2a2e">桌面版</a> · 
  <a href="mobile.html" style="color:#2a2a2e">手机版</a>
</p>
</body>
</html>
